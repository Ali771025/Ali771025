[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pro-annotator"
version = "2.0.0"
description = "Offline Professional AI-Assisted Annotator with Batch + Tiny LLM"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name="offline-pro-annotator"}]
dependencies = [
  "numpy>=1.24",
  "opencv-python>=4.8",
  "onnxruntime>=1.16",
  "onnx>=1.14",
  "PyYAML>=6.0",
  "pydantic>=2.0",
  "typer>=0.9",
  "loguru>=0.7",
  "tqdm>=4.66",
  "pillow>=10.0",
  "PySide6>=6.5",
]

[project.optional-dependencies]
llama = ["llama-cpp-python>=0.2.50"]
transformers = ["transformers>=4.38", "accelerate>=0.27"]
onnx-llm = ["optimum[onnxruntime]>=1.16"]
ultralytics = ["ultralytics>=8.1", "torch>=2.0", "torchvision>=0.15"]
all = ["llama-cpp-python>=0.2.50", "transformers>=4.38", "accelerate>=0.27", "optimum[onnxruntime]>=1.16", "ultralytics>=8.1", "torch>=2.0"]

[project.scripts]
pro-annotator = "pro_annotator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pro_annotator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

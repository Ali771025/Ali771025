# QORA Platform — local stack (PostgreSQL-ready) [TECH]
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://qora:qora@db:5432/qora
      SECRET_KEY: change-me-in-production
    depends_on: [db, redis]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  web:
    build: ./frontend
    ports: ["5173:5173"]
    depends_on: [api]
    command: npm run dev -- --host 0.0.0.0

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qora
      POSTGRES_PASSWORD: qora
      POSTGRES_DB: qora
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
